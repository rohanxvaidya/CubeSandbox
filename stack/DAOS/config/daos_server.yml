# DAOS Server configuration file

name: daos_server
access_points: ['daos-server']
port: 10001

provider: ofi+tcp;ofi_rxm
socket_dir: /var/run/daos_server
nr_hugepages: 4096

transport_config:
  allow_insecure: true

helper_log_file: /tmp/daos_server_helper.log
control_log_file: /tmp/daos_server.log
#control_log_mask: INFO
control_log_mask: DEBUG

# env_vars:
# - FI_LOG_LEVEL=warn
# - FI_SOCKETS_MAX_CONN_RETRY=1
# - FI_SOCKETS_CONN_TIMEOUT=2000
# - D_LOG_MASK=DEBUG
# - DD_SUBSYS=all
# - DD_MASK=all
# - HG_LOG_LEVEL=debug

engines:
  - targets: 1
    first_core: 0
    nr_xs_helpers: 0
    fabric_iface: ens11
    fabric_iface_port: 31416
    log_file: /tmp/daos_engine_0.log
    log_mask: DEBUG
    storage:
      - class: ram
        scm_mount: /mnt/daos
        scm_size: 32
      - class: file
        #bdev_class: file
        bdev_list: [/tmp/daos-bdev]
        bdev_size: 32


